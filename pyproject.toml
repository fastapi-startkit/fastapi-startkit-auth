[project]
name = "fastapi-startkit-auth"
version = "0.1.0"
description = "Passport-style OAuth2 + JWT authentication package for FastAPI (guards, providers, grants, scopes, personal access tokens, password resets)."
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "fastapi",
    "oauth2",
    "jwt",
    "auth",
    "passport",
    "authentication",
    "authorization",
    "security",
    "tokens",
    "starter-kit",
]
authors = [
    {name = "Bedram Tamang", email = "tmgbedu@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pydantic>=2",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/fastapi-startkit/fastapi-startkit-auth"
Documentation = "https://fastapi-startkit.github.io/fastapi-startkit-auth/"
Repository = "https://github.com/fastapi-startkit/fastapi-startkit-auth"
Issues = "https://github.com/fastapi-startkit/fastapi-startkit-auth/issues"
Changelog = "https://github.com/fastapi-startkit/fastapi-startkit-auth/releases"

[project.optional-dependencies]
masoniteorm = ["masonite-orm>=2.18"]
# The framework itself only supports Python >=3.12; on older interpreters the
# extra resolves to nothing and the package stays standalone.
startkit = ["fastapi-startkit>=0.51; python_version >= '3.12'"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.9.0",
    "twine>=6.0.0",
]

[tool.uv]
# masonite-orm pins cleo<2.0 while fastapi-startkit needs cleo>=2.1: the two
# extras are mutually exclusive and cannot be locked together.
conflicts = [
    [
        { extra = "masoniteorm" },
        { extra = "startkit" },
    ],
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F401"]
fixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
norecursedirs = [".venv", "dist", "build", "__pycache__"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
