site_name: fastapi-startkit-auth
site_description: Passport-style OAuth2 + JWT authentication for FastAPI.
site_url: https://fastapi-startkit.github.io/fastapi-startkit-auth/
repo_url: https://github.com/fastapi-startkit/fastapi-startkit-auth
repo_name: fastapi-startkit/fastapi-startkit-auth
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Providers: providers.md
  - HTTP endpoints: endpoints.md
  - Grants: grants.md
  - Scopes & abilities: scopes.md
  - Password resets: password-resets.md
  - Auth roadmap: roadmap-auth.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
